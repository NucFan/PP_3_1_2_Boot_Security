<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">

<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/common :: sidebar('admin')}"></aside>

    <main class="flex-grow-1 p-4">
        <h1 class="mb-4">Admin panel</h1>

        <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/}">Users table</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" th:href="@{/admin/new}">New User</a>
            </li>
        </ul>

        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0">Add new user</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/create}" method="post" style="max-width: 480px; margin: 0 auto;">
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">First name</label>
                        <input type="text" class="form-control" name="firstName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Last name</label>
                        <input type="text" class="form-control" name="lastName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Age</label>
                        <input type="number" class="form-control" name="age">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label d-block text-center fw-bold">Role</label>
                        <select class="form-select" name="roles" multiple size="2" required>
                            <option th:each="role : ${allRoles}"
                                    th:value="${role.id}"
                                    th:text="${#strings.replace(role.name, 'ROLE_', '')}">USER</option>
                        </select>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-success px-4">Add new user</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
