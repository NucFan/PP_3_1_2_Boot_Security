<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">

<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/common :: sidebar('admin')}"></aside>

    <main class="flex-grow-1 p-4">
        <h1 class="mb-4">Admin panel</h1>

        <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
                <a class="nav-link active" th:href="@{/admin/}">Users table</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/admin/new}">New User</a>
            </li>
        </ul>

        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0">All users</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.firstName}">First</td>
                        <td th:text="${user.lastName}">Last</td>
                        <td th:text="${user.age}">25</td>
                        <td th:text="${user.email}">email</td>
                        <td>
                            <span th:each="role : ${user.roles}"
                                  class="me-1"
                                  th:text="${#strings.replace(role.name, 'ROLE_', '')}">USER</span>
                        </td>
                        <td>
                            <button type="button"
                                    class="btn btn-info btn-sm text-white"
                                    data-bs-toggle="modal" data-bs-target="#editModal"
                                    th:attr="data-id=${user.id},
                                             data-firstName=${user.firstName},
                                             data-lastName=${user.lastName},
                                             data-age=${user.age},
                                             data-email=${user.email},
                                             data-roleIds=${#strings.listJoin(user.roles.![id], ',')}">
                                Edit
                            </button>
                        </td>
                        <td>
                            <button type="button"
                                    class="btn btn-danger btn-sm"
                                    data-bs-toggle="modal" data-bs-target="#deleteModal"
                                    th:attr="data-id=${user.id},
                                             data-firstName=${user.firstName},
                                             data-lastName=${user.lastName},
                                             data-age=${user.age},
                                             data-email=${user.email},
                                             data-roleIds=${#strings.listJoin(user.roles.![id], ',')}">
                                Delete
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- ══════ EDIT MODAL ══════ -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/update}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">ID</label>
                        <input type="text" class="form-control bg-light" id="edit-id" name="id" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">First name</label>
                        <input type="text" class="form-control" id="edit-firstName" name="firstName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Last name</label>
                        <input type="text" class="form-control" id="edit-lastName" name="lastName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Age</label>
                        <input type="number" class="form-control" id="edit-age" name="age">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Email</label>
                        <input type="email" class="form-control" id="edit-email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Password</label>
                        <input type="password" class="form-control" id="edit-password" name="password"
                               placeholder="Оставьте пустым, чтобы не менять">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Role</label>
                        <select class="form-select" id="edit-roles" name="roles" multiple size="2">
                            <option th:each="role : ${allRoles}"
                                    th:value="${role.id}"
                                    th:text="${#strings.replace(role.name, 'ROLE_', '')}">USER</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- ══════ DELETE MODAL ══════ -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/delete}" method="post">
                <input type="hidden" name="id" id="delete-id">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">ID</label>
                        <input type="text" class="form-control bg-light" id="delete-id-display" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">First name</label>
                        <input type="text" class="form-control bg-light" id="delete-firstName" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Last name</label>
                        <input type="text" class="form-control bg-light" id="delete-lastName" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Age</label>
                        <input type="text" class="form-control bg-light" id="delete-age" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Email</label>
                        <input type="text" class="form-control bg-light" id="delete-email" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block text-center fw-bold">Role</label>
                        <select class="form-select bg-light" id="delete-roles" multiple size="2" disabled>
                            <option th:each="role : ${allRoles}"
                                    th:value="${role.id}"
                                    th:text="${#strings.replace(role.name, 'ROLE_', '')}">USER</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function fillRoleSelect(selectId, roleIdsCsv) {
        const select = document.getElementById(selectId);
        const ids = (roleIdsCsv || '').split(',').filter(x => x);
        for (const opt of select.options) {
            opt.selected = ids.includes(opt.value);
        }
    }

    document.getElementById('editModal').addEventListener('show.bs.modal', function (event) {
        const b = event.relatedTarget;
        document.getElementById('edit-id').value         = b.getAttribute('data-id');
        document.getElementById('edit-firstName').value  = b.getAttribute('data-firstName');
        document.getElementById('edit-lastName').value   = b.getAttribute('data-lastName');
        document.getElementById('edit-age').value        = b.getAttribute('data-age');
        document.getElementById('edit-email').value      = b.getAttribute('data-email');
        document.getElementById('edit-password').value   = '';
        fillRoleSelect('edit-roles', b.getAttribute('data-roleIds'));
    });

    document.getElementById('deleteModal').addEventListener('show.bs.modal', function (event) {
        const b = event.relatedTarget;
        document.getElementById('delete-id').value          = b.getAttribute('data-id');
        document.getElementById('delete-id-display').value  = b.getAttribute('data-id');
        document.getElementById('delete-firstName').value   = b.getAttribute('data-firstName');
        document.getElementById('delete-lastName').value    = b.getAttribute('data-lastName');
        document.getElementById('delete-age').value         = b.getAttribute('data-age');
        document.getElementById('delete-email').value       = b.getAttribute('data-email');
        fillRoleSelect('delete-roles', b.getAttribute('data-roleIds'));
    });
</script>

</body>
</html>
