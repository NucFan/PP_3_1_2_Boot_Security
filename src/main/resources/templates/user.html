<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">

<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/common :: sidebar('user')}"></aside>

    <main class="flex-grow-1 p-4">
        <h1 class="mb-4">User information-page</h1>

        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0">About user</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Age</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${loggedUser != null}">
                        <td th:text="${loggedUser.id}">1</td>
                        <td th:text="${loggedUser.firstName}">First</td>
                        <td th:text="${loggedUser.lastName}">Last</td>
                        <td th:text="${loggedUser.age}">25</td>
                        <td th:text="${loggedUser.email}">email</td>
                        <td>
                            <span th:each="role : ${loggedUser.roles}"
                                  class="me-1"
                                  th:text="${#strings.replace(role.name, 'ROLE_', '')}">USER</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
