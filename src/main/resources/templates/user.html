<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>User page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-white">

<nav th:replace="~{fragments/common :: navbar}"></nav>

<div class="d-flex">
    <aside th:replace="~{fragments/common :: sidebar('user')}"></aside>

    <main class="flex-grow-1 p-4">
        <h1 class="mb-4">User information-page</h1>

        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0">About user</h5>
            </div>
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th><th>First Name</th><th>Last Name</th>
                        <th>Age</th><th>Email</th><th>Roles</th>
                    </tr>
                    </thead>
                    <tbody id="me-tbody">
                    <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function escapeHtml(s) {
        return String(s ?? '')
            .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
            .replaceAll('"','&quot;').replaceAll("'",'&#39;');
    }

    (async () => {
        const tbody = document.getElementById('me-tbody');
        try {
            const resp = await fetch('/api/users/me', {
                headers: { 'Accept': 'application/json' }
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const u = await resp.json();

            const roles = (u.roles || []).map(r => r.replace('ROLE_','')).join(', ');

            tbody.innerHTML = `
            <tr>
                <td>${u.id}</td>
                <td>${escapeHtml(u.firstName)}</td>
                <td>${escapeHtml(u.lastName)}</td>
                <td>${u.age ?? ''}</td>
                <td>${escapeHtml(u.email)}</td>
                <td>${escapeHtml(roles)}</td>
            </tr>`;
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">${escapeHtml(e.message)}</td></tr>`;
        }
    })();
</script>

</body>
</html>
